name: Release iOS

# iOS builds run on GitHub's macOS runners — you do NOT need your own Mac.
#
# Two modes, chosen automatically by whether signing secrets exist:
#  - No secrets  → compiles a --no-codesign build. Proves the app builds for
#    iOS on every push; produces nothing installable (Apple requires signing
#    to install anywhere, including TestFlight).
#  - Secrets set → signs and uploads to TestFlight. Requires the Apple
#    Developer Program ($99/yr). See docs/CD.md for the exact secrets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  ios:
    # Apple requires App Store/TestFlight builds to use the current iOS SDK.
    # As of 2026 that's the iOS 26 SDK (Xcode 26) — older images (macos-15 ships
    # Xcode 16 / iOS 18.5 SDK) are rejected on upload with a 409 SDK-version
    # error. macos-26 ships Xcode 26 by default.
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      # Job-level so the restore step can gate on `env.` in its `if:`.
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # Surfaced in the log so a future toolchain mismatch is one glance away
      # rather than a wall of parse errors from inside a pod.
      - name: Show Xcode version
        run: xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      # Firebase's iOS plugins break `flutter pub get` under Swift Package
      # Manager on CI (rsync into build/ios/SourcePackages fails). Force the
      # stable CocoaPods path instead.
      - name: Use CocoaPods (not SPM) for iOS plugins
        run: flutter config --no-enable-swift-package-manager

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # Firebase's iOS config. The file must already be a member of the Runner
      # target in Xcode (add it once from the Firebase console download and
      # commit the .pbxproj reference); the actual plist is gitignored and
      # restored here so builds can bundle it. Without it, push is inert.
      - name: Restore GoogleService-Info.plist (enables push, if configured)
        if: env.GOOGLE_SERVICE_INFO_PLIST_BASE64 != ''
        working-directory: app
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > ios/Runner/GoogleService-Info.plist
          echo "Firebase iOS config restored — push enabled for this build."

      - name: Warn if no Firebase iOS config
        if: env.GOOGLE_SERVICE_INFO_PLIST_BASE64 == ''
        run: echo "::warning::No GOOGLE_SERVICE_INFO_PLIST_BASE64 secret — building without Firebase; push notifications will not work in this build."

      # ---- Validation build (always) --------------------------------------
      - name: Build iOS (no code signing)
        if: env.ASC_KEY_ID == ''
        working-directory: app
        run: |
          flutter build ios --release --no-codesign
          echo "::notice::Compiled for iOS. Add signing secrets (docs/CD.md) to ship to TestFlight."

      # ---- Signed TestFlight build (when secrets are present) --------------
      - name: Import signing certificate
        if: env.ASC_KEY_ID != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      # Signing diagnostics: a valid identity here is cert + matching private
      # key with a complete chain. "0 valid identities found" means the .p12
      # is cert-only, has a mismatched key, or is missing the WWDR intermediate.
      - name: Show signing identities
        if: env.ASC_KEY_ID != ''
        run: |
          echo "Keychains in search list:"; security list-keychains -d user
          echo "Codesigning identities:"; security find-identity -v -p codesigning || true

      - name: Install provisioning profile
        if: env.ASC_KEY_ID != ''
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/twokeys.mobileprovision

      - name: Write ExportOptions.plist
        if: env.ASC_KEY_ID != ''
        working-directory: app/ios
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>5858K3V8JQ</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>nl.notfinal.twofa</key><string>Purr Prov</string></dict>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF

      - name: Build signed IPA
        if: env.ASC_KEY_ID != ''
        working-directory: app
        run: |
          ARGS="--release --build-number=${{ github.run_number }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ARGS="$ARGS --build-name=${GITHUB_REF_NAME#v}"
          fi
          flutter build ipa $ARGS --export-options-plist=ios/ExportOptions.plist

      # The upload action passes app-path straight to altool without expanding
      # globs, so resolve the real filename here (flutter names it after the app).
      - name: Locate the built IPA
        if: env.ASC_KEY_ID != ''
        id: ipa
        run: |
          IPA=$(ls app/build/ios/ipa/*.ipa | head -1)
          echo "Found IPA: $IPA"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        if: env.ASC_KEY_ID != ''
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
