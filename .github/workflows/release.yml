name: Release (Android + Extension)

# Build installable artifacts on GitHub's runners — no local build needed.
# - Push a tag like v0.2.0  → builds, attaches AAB/APK/extension zip to a
#   GitHub Release, and (if configured) uploads the AAB to Play internal.
# - Run manually (Actions → Release → Run workflow) → builds and uploads the
#   same files as workflow artifacts you can download, without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      play_track:
        description: "Play track to publish the AAB to (blank = don't publish)"
        required: false
        default: ""

# Needed so the workflow can attach files to the GitHub Release it creates.
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Derive version name from tag
        id: ver
        run: |
          REF="${{ github.ref_name }}"
          if [[ "${{ github.ref_type }}" == "tag" && "$REF" == v* ]]; then
            echo "name=${REF#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore release keystore (if configured)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: app/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/upload.jks
          cat > key.properties <<EOF
          storeFile=${{ github.workspace }}/app/android/app/upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "Release keystore configured."

      - name: Warn if unsigned
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building with the debug key. Fine for sideload testing, NOT accepted by Play."

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build AAB + APK
        working-directory: app
        run: |
          ARGS="--release --build-number=${{ github.run_number }}"
          if [ -n "${{ steps.ver.outputs.name }}" ]; then
            ARGS="$ARGS --build-name=${{ steps.ver.outputs.name }}"
          fi
          flutter build apk $ARGS
          flutter build appbundle $ARGS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab

      - name: Publish to Google Play (if configured)
        # Runs on tag pushes when a Play service account is set, or on manual
        # runs where you named a track.
        if: >
          env.PLAY_SERVICE_ACCOUNT_JSON != '' &&
          (github.ref_type == 'tag' || github.event.inputs.play_track != '')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: nl.notfinal.twofa
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.play_track || 'internal' }}
          status: completed

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build extension
        working-directory: extension
        run: |
          npm ci
          npm run build
      - name: Zip for the stores
        working-directory: extension/dist
        run: zip -r ../twokeys-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/twokeys-extension.zip
      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: extension/twokeys-extension.zip
